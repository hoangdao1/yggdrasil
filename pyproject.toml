[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yggdrasil-lm"
version = "0.1.19"
description = "Yggdrasil: a Python framework for graph-native agent orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Hoang Dao" },
]
keywords = ["agents", "graph", "llm", "orchestration", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "mcp>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic   = ["anthropic>=0.40.0"]
openai      = ["openai>=1.0"]
neo4j       = ["neo4j>=5.0"]
claude-code = ["claude-agent-sdk>=0.1"]
embeddings  = ["sentence-transformers>=3.0"]
dev         = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff", "mypy>=1.11", "types-networkx", "rich>=13.0"]
observe     = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
viz         = ["fastapi>=0.100", "uvicorn>=0.24", "websockets>=11.0"]

[project.scripts]
yggdrasil-config = "yggdrasil_lm.config.cli:main"
yggdrasil = "yggdrasil_lm.graphadmin.cli:main"

[project.urls]
Homepage = "https://github.com/hoangdao1/yggdrasil"
Repository = "https://github.com/hoangdao1/yggdrasil"
Issues = "https://github.com/hoangdao1/yggdrasil/issues"
Documentation = "https://github.com/hoangdao1/yggdrasil#readme"

[tool.hatch.build.targets.wheel]
packages = ["yggdrasil_lm"]

[tool.hatch.build.targets.sdist]
include = [
    "/yggdrasil_lm",
    "/README.md",
    "/API_REFERENCE.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = ["yggdrasil_lm"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Optional extras: type-check cleanly whether or not they are installed.
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "openai.*",
    "neo4j.*",
    "claude_agent_sdk.*",
    "sentence_transformers.*",
    "opentelemetry.*",
    "fastapi.*",
    "uvicorn.*",
    "rich.*",
]
ignore_missing_imports = true

# FastAPI route decorators are untyped when the viz extra is not installed.
[[tool.mypy.overrides]]
module = ["yggdrasil_lm.viz.server"]
disallow_untyped_decorators = false

[tool.ruff]
line-length = 100
