name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (declarative style + function-quality gates)
        run: uv run ruff check .

      - name: Type check (strict mypy)
        run: uv run mypy

      - name: Test (behaviour + AST quality gates: no monster functions, no index loops)
        run: uv run pytest